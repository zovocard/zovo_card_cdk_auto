<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0c11" />
    <title>CDK Portal</title>
    <!-- 字体按皮肤由 theme.ts 按需加载（不阻塞首屏）；这里只预连 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* 样式表到达前的首屏底色，避免夜间模式先闪一下白 */
      /* 只给 html：body 要保持透明，否则会盖住主题的固定氛围层 */
      /* :where() 零特异性：样式表一到，各皮肤自己的底色就能覆盖它 */
      :where(html.dark) { background: #0c0c11; color: #f4f1ea; }
    </style>
    <script>
      (function () {
        try {
          // 默认：卡台新版(zovo) + 夜间。与 theme.ts、后端 /public/site 的默认值保持一致
          var mode = localStorage.getItem('theme-mode') || 'dark'
          var skin = localStorage.getItem('site-skin') || 'zovo'
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          // 皮肤的「默认暗色 / 后台布局」由 theme.ts 每次应用皮肤时写进 site-skin-boot，这里只读，
          // 不再在这里另写一份皮肤清单（以前两处要同步改，漏改首屏就闪错样式）。
          var boot = null
          try { boot = JSON.parse(localStorage.getItem('site-skin-boot') || 'null') } catch (e) {}
          if (!boot || boot.skin !== skin) boot = null
          if (boot && boot.preferDark) dark = true
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-skin', skin)
          document.documentElement.setAttribute('data-layout', (boot && boot.layout) || 'top')
          if (boot && boot.family) document.documentElement.setAttribute('data-family', boot.family)
          // 管理端(/ops)：不透明面板、静态氛围、完整 Element Plus 配色映射（见 styles/admin.css）。
          // 首屏就标上，避免样式表到达后再切一次造成闪动/位移。
          if (location.pathname === '/ops' || location.pathname.indexOf('/ops/') === 0) document.documentElement.setAttribute('data-area', 'admin')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
